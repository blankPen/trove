name: Release

# 合并到 main 即发版:版本号取自 package.json,PR 里改好版本再合并。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 建 tag + GitHub Release
  id-token: write # npm trusted publishing(OIDC)+ provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Upgrade npm CLI
        run: npm install -g npm@12 # trusted publishing 需要 npm ≥ 11.5.1

      - name: Publish to npm and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          published=0
          if npm view "$name@$version" version >/dev/null 2>&1; then published=1; fi
          released=0
          if gh release view "$tag" >/dev/null 2>&1; then released=1; fi

          if [ "$published" = 1 ] && [ "$released" = 1 ]; then
            echo "$tag 已发布(npm + GitHub Release),跳过"
            exit 0
          fi

          if [ "$published" = 0 ]; then
            if ! npm publish --provenance --access public; then
              echo "::error::npm publish 失败。token 需勾选 Bypass 2FA;若报 trusted publishing 相关错误,需在 npmjs.com 给 $name 配置 Trusted Publisher(GitHub Actions:$REPO,工作流 release.yml)。"
              exit 1
            fi
            # 新版本在 registry 上线要一会儿;stage-only token 只会暂存,不会真正上线
            for i in $(seq 1 10); do
              if npm view "$name@$version" version >/dev/null 2>&1; then break; fi
              echo "等待 $name@$version 在 npm 上线($i/10)"
              sleep 20
            done
            if ! npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::error::$name@$version 没有真正上线。stage-only token 只会暂存版本,需要维护者执行 npm stage approve <stage-id> --otp <code>;或改用 trusted publishing。"
              exit 1
            fi
          fi

          if [ "$released" = 0 ]; then
            npm pack
            gh release create "$tag" --title "$tag" --generate-notes "./${name}-${version}.tgz"
          fi
